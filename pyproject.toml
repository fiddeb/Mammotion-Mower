[project]
name = "mammotion-openapi-ha"
version = "0.1.1"
description = "Home Assistant integration for the official Mammotion Open API"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.375", "ruff==0.17.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
